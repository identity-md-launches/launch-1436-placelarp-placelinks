# LARP: Linked Avatar Registry Protocol, by the IMD6900 frens. Launched through the IMD swarm on Ethereum. Builds
# offline: every library is vendored under lib/ (only what is imported). bytecode_hash = "none", as IMD's launches
# require.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
auto_detect_solc = true
bytecode_hash = "none"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "solmate/=lib/solmate/",
    "solady/=lib/solady/src/",
]

[fuzz]
# one seed: every run, here and in IMD's builds, draws the same cases
seed = "0x6900"

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
